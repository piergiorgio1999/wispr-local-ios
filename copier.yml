_min_copier_version: "9"

project_name:
  type: str

github_owner:
  type: str

comment_language:
  type: str
  choices:
    Italiano: it
    English: en
  default: it

single_owner:
  type: bool
  default: true

use_swift:
  type: bool
  default: true

use_typescript:
  type: bool
  default: true

use_python:
  type: bool
  default: true

use_rust:
  type: bool
  default: true

use_go:
  type: bool
  default: true

use_shell:
  type: bool
  default: true

_subdirectory: .
